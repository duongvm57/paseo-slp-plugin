name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # The test-shard matrix below must list exactly 1..SHARD_COUNT; the validate
  # coverage gate re-measures the partition and fails closed on any missing,
  # duplicate or extra shard.
  SHARD_COUNT: '4'

jobs:
  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Test shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}
        run: |
          temp_paseo_home="$(mktemp -d)"
          trap 'rm -rf "$temp_paseo_home"' EXIT
          record_dir="${RUNNER_TEMP}/shard-record-${{ matrix.shard }}"
          PASEO_HOME="$temp_paseo_home" node scripts/test-isolated.mjs \
            "--shard=${{ matrix.shard }}/${{ env.SHARD_COUNT }}" \
            "--slp-record=${record_dir}"

      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-record-${{ matrix.shard }}
          retention-days: 1

  validate:
    needs: test-shard
    # Run even when a shard failed, was cancelled or was skipped, so the
    # required check fails by name instead of disappearing as a skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Gate on shard results
        run: node scripts/test-shards-gate.mjs "${{ needs.test-shard.result }}"

      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shard-records

      - name: Verify shard coverage
        run: node scripts/test-shards-verify.mjs "${RUNNER_TEMP}/shard-records" "--expect-node=${{ matrix.node }}" "--expect-count=${{ env.SHARD_COUNT }}"

      - run: npm run typecheck

      - run: npm run check

      - run: npm run check:plugin-payload
