<title id="title">Paseo SLP: mô hình làm việc</title>
<desc id="description">Human giao việc thẳng cho Lead hoặc làm việc qua Supervisor tùy chọn. Lead định khung và tích hợp công việc, giao outcome có giới hạn cho Peer độc lập, nhận lại bằng chứng và phản biện. Supervisor quan sát workflow và chuyển quyết định của Human, đứng ngoài phần thực thi. Plugin nạp hướng dẫn role và kiểm tra bước chuẩn bị khởi chạy; Paseo vẫn là control plane của agent.</desc>
