<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1568 768" role="img" aria-label="A task in Paseo SLP, end to end: you give the Supervisor an objective; it observes or creates a Lead; the Lead frames the work and routes bounded outcomes to Peers; Peers return evidence, challenges or blocked work; the Lead integrates and gives the verdict; the Supervisor checks the handback and reports to you.">
