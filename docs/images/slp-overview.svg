<title id="title">Paseo SLP at a glance</title>
<desc id="description">The Human assigns a Lead directly or works through an optional Supervisor. The Lead frames and integrates work, delegates bounded outcomes to independent Peers, and receives evidence and challenges. The Supervisor observes workflow and relays Human decisions outside execution. The plugin delivers role instructions and checks launch preparation; Paseo remains the agent control plane.</desc>
