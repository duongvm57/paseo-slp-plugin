<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1008" viewBox="0 0 960 1008" role="img" xml:lang="en" aria-labelledby="title description">
<title id="title">Paseo SLP: roles, durable work and evidence</title>
<desc id="description">The Human owns intent and final acceptance. Paseo runs ordinary agents. The Lead frames and integrates bounded work with independent Peers; an optional Supervisor observes workflow. One repository desk records briefs, decisions, tasks and dependencies, moving scopes, selected reviews, supervised dispatch, staged integration, candidate/check evidence, resource accounts and planned owner handoff. The workspace panel reads these records without establishing acceptance. The plugin delivers role instructions and checked launch preparation.</desc>
