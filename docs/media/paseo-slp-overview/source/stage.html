      const p = el('path', { d, fill:'none', stroke:'none' }, g);
      const dot = el('circle', { r:o.r || 11, fill:o.color || C.orange, stroke:'#fff', 'stroke-width':3 }, g);

        hold:o.hold !== false, ...timing(o) });
      return g;
    },

      const g = wrap({ ...o, dy:0 }), col = o.color || C.red;
      const inner = el('g', { transform:`translate(${x},${y}) rotate(${o.rot ?? -8})` }, g);
      const w = o.w || (s.length * 25 + 50);

      const t = el('text', { x:0, y:13, 'text-anchor':'middle', 'font-size':38, 'font-weight':800, fill:col,
        'letter-spacing':3 }, inner);
      t.textContent = s;
      items.push({ kind:'pop', node:inner, x, y, rot:o.rot ?? -8, ...timing(o) });
      return g;
    },
    strike(x1, y1, x2, y2, o = {}) {

    },
    avatar(cx, cy, label, o = {}) {
      const g = wrap(o), col = o.color || C.teal;
      el('circle', { cx, cy, r:o.r || 38, fill:o.fill || col, stroke:'#fff', 'stroke-width':4, filter:'url(#shadow)' }, g);

      t.textContent = label;
      return g;
    },
  };
  return ctx;
}

// --------------------------------------------------------------- runtime ----
function translate(root) {
  if (LANG === 'en') return;
  const dict = I18N[LANG] || {};
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    const raw = n.nodeValue, t = raw.replace(/\u00a0/g, ' ').trim();
    if (!t || SKIP.has(t) || KEEP.has(t) || /^(rev \d+|#[0-9a-f]+…)$/.test(t)) continue;
    if (dict[t] != null) { n.nodeValue = raw.replace(/\u00a0/g, ' ').replace(t, dict[t]); continue; }
    if (/[A-Za-z]{3,}/.test(t)) MISSING.add(t);
  }
}

function init(timeline) {
  TL = timeline; LANG = timeline.lang || 'en'; LBL = timeline.labels || {};
  SKIP = new Set(); MISSING = new Set();
  document.body.classList.toggle('vi', LANG === 'vi');
  const root = document.getElementById('scenes');
  root.innerHTML = '';
  SCENES = TL.scenes.map((scene, i) => {
    const g = el('g', { opacity:0 }, root);
    const ctx = makeCtx(scene, g);
    if (scene.id !== 'title') chrome(ctx, scene, i, TL.scenes.length - 1);
    BUILD[scene.id](ctx);
    translate(g);
    return { scene, g, ctx };
  });
  CAPTIONS = TL.scenes.flatMap(s => s.cues.map((c, k) => ({ ...c, show:k + 1 < s.cues.length ? s.cues[k + 1].start : s.end })));
  const ch = document.getElementById('chrome');
  ch.innerHTML = '';
  const cap = el('g', {}, ch);
  el('rect', { x:96, y:928, width:1728, height:118, rx:14, fill:C.code, opacity:.96 }, cap);
  const f = el('foreignObject', { x:96, y:928, width:1728, height:118 }, cap);
  const d = document.createElementNS(XH, 'div'); d.className = 'cap'; f.appendChild(d);
  const honest = el('g', {}, ch), hText = LBL.honest || 'explanatory animation · not live footage';
  const hw = Math.max(420, Math.round(hText.length * 11 + 44));
  el('rect', { x:1824 - hw, y:72, width:hw, height:42, rx:21, fill:'#fff', stroke:C.orange, 'stroke-width':1.5 }, honest);
  const ht = el('text', { x:1824 - hw / 2, y:100, 'text-anchor':'middle', 'font-size':18, fill:C.orange, class:'mono' }, honest);
  ht.textContent = hText;
  if (TL.narration && LBL.credit) {
    const cr = el('text', { x:1824, y:1064, 'text-anchor':'end', 'font-size':16, fill:C.muted, class:'mono' }, ch);
    cr.textContent = LBL.credit;
  }
  el('rect', { x:0, y:1072, width:1920, height:8, fill:C.soft }, ch);
  const bar = el('rect', { x:0, y:1072, width:0, height:8, fill:C.teal }, ch);
  CHROME = { cap, capDiv:d, honest, bar };
  return { scenes:SCENES.length, duration:TL.duration, lang:LANG, untranslated:[...MISSING] };
}

function renderItem(it, lt) {
  const out = it.tOut === Infinity ? 0 : ease((lt - it.tOut) / .35);
  if (it.kind === 'fade') {
    const p = ease((lt - it.tIn) / .5);
    it.node.setAttribute('opacity', (p * (1 - out)).toFixed(3));
    it.node.setAttribute('transform', `translate(0,${((1 - p) * it.dy).toFixed(2)})`);
  } else if (it.kind === 'pop') {
    const u = (lt - it.tIn) / .35, p = ease(u), s = u <= 0 ? 1.6 : 1 + .6 * (1 - p);
    it.node.parentNode.setAttribute('opacity', (p * (1 - out)).toFixed(3));
    it.node.setAttribute('transform', `translate(${it.x},${it.y}) rotate(${it.rot}) scale(${s.toFixed(3)})`);
  } else if (it.kind === 'draw') {
    const p = easeIO((lt - it.tIn) / it.dur);
    it.node.setAttribute('opacity', (p > 0 ? 1 - out : 0).toFixed(3));
    if (it.dash && p >= 1) { it.path.setAttribute('stroke-dasharray', it.dash); it.path.removeAttribute('stroke-dashoffset'); }
    else { it.path.setAttribute('stroke-dasharray', `${it.L} ${it.L}`); it.path.setAttribute('stroke-dashoffset', (it.L * (1 - p)).toFixed(2)); }
    if (it.head.parentNode) it.head.setAttribute('opacity', p > .92 ? 1 : 0);
  } else if (it.kind === 'token') {
    let u = (lt - it.tIn) / it.dur;
    let vis = u >= 0 && lt < it.tOut;
    if (it.repeat) u = u - Math.floor(u);
    else if (u > 1) { vis = vis && it.hold; u = 1; }
    const q = easeIO(Math.max(0, u)), pt = it.path.getPointAtLength(q * it.L);
    it.dot.setAttribute('cx', pt.x.toFixed(2)); it.dot.setAttribute('cy', pt.y.toFixed(2));
    it.node.setAttribute('opacity', vis ? 1 : 0);
  }
}

function renderAt(t, opts = {}) {
  for (const s of SCENES) {
    const { start, end } = s.scene;
    if (t < start - .01 || t > end + .01) { s.g.setAttribute('opacity', 0); s.g.setAttribute('display', 'none'); continue; }
    s.g.removeAttribute('display');
    const lt = t - start;
    const vis = Math.min(ease(lt / .45), s.scene.last ? 1 : ease((end - t) / .4));
    s.g.setAttribute('opacity', vis.toFixed(3));
    for (const it of s.ctx.items) renderItem(it, lt);
  }
  const cur = CAPTIONS.find(c => t >= c.start && t < c.show);
  const cap = CHROME.capDiv;
  if (cur) {
    if (cap.dataset.k !== String(cur.start)) {
      cap.textContent = cur.text; cap.dataset.k = String(cur.start);
      cap.style.fontSize = cur.text.length > 150 ? '30px' : cur.text.length > 120 ? '33px' : '35px';
    }
    const a = Math.min(ease((t - cur.start) / .2), ease((cur.show - t) / .2));
    cap.style.opacity = a.toFixed(3);
    CHROME.cap.setAttribute('opacity', 1);
  } else {
    CHROME.cap.setAttribute('opacity', opts.poster ? 0 : 1);
    cap.textContent = ''; cap.dataset.k = '';
  }
  const inTitle = SCENES[0] && t < SCENES[0].scene.end;
  CHROME.honest.setAttribute('opacity', inTitle ? 0 : 1);
  CHROME.bar.setAttribute('width', (1920 * Math.min(1, t / TL.duration)).toFixed(1));
  const old = document.getElementById('poster'); if (old) old.remove();
  if (opts.poster) {
    CHROME.cap.setAttribute('opacity', 0); CHROME.bar.setAttribute('width', 0);
    const g = el('g', { id:'poster' }, document.getElementById('chrome'));
    el('rect', { x:96, y:928, width:1728, height:118, rx:14, fill:C.code }, g);
    el('circle', { cx:186, cy:987, r:38, fill:C.orange }, g);
    el('path', { d:'M 174 966 L 174 1008 L 208 987 Z', fill:'#fff' }, g);
    const tx = el('text', { x:254, y:1000, 'font-size':36, 'font-weight':700, fill:'#fff' }, g);
    tx.textContent = opts.poster;
  }
  return true;
}
